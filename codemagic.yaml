# Codemagic build recipe for the Cardtly iOS app.
#
# The app is a Capacitor remote-URL wrapper: the native shell loads
# www.cardtly.com in a WebView. There is deliberately NO `npm run build` here -
# the web is already live on Vercel, so the iOS build only assembles, signs and
# ships the native shell, needing none of the website's secrets.
#
# Signing uses the App Store Connect API key directly (not a paid "team
# integration"), so this works on the free Individual account. The four values
# live in a Codemagic variable group named `appstore`, and the Codemagic CLI
# tools below read them from these exact variable names:
#   APP_STORE_CONNECT_ISSUER_ID
#   APP_STORE_CONNECT_KEY_IDENTIFIER
#   APP_STORE_CONNECT_PRIVATE_KEY   (the .p8 file contents)
#   CERTIFICATE_PRIVATE_KEY         (an RSA key used to create the signing cert)
#
# First CI builds commonly need a round or two to go green - the log says why.

workflows:
  ios-testflight:
    name: Cardtly iOS - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - appstore
      vars:
        BUNDLE_ID: "com.cardtly.app"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      # Capacitor 8's CLI requires Node >= 22. Local dev runs 24; 22 is the LTS
      # and the safe floor.
      node: 22
      # `latest` tracks Codemagic's current stable Xcode. Pin (e.g. "16.2") only
      # if a build ever fails on a too-new Xcode.
      xcode: latest

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Exclude the NFC plugin from the iOS build
        # @exxili/capacitor-nfc@0.0.13 ships a broken Swift Package - its
        # Package.swift does not export the product it declares, so SPM
        # resolution fails with "product 'ExxiliCapacitorNfc' ... not found".
        # iOS cannot use this plugin anyway: Apple reserves tap-to-share (host
        # card emulation) for Apple Pay. Removing it here, before cap sync,
        # means the generated Package.swift leaves it out.
        #
        # This is iOS-CI only. It edits this disposable build checkout, never
        # the repo, so Android and the website keep the plugin. The web guards
        # every NFC call behind isNFCSupported() (lib/capacitor.ts), which
        # returns false when the native plugin is absent - so on iPhone NFC just
        # quietly does not appear.
        script: npm uninstall @exxili/capacitor-nfc

      - name: Capacitor sync iOS
        script: npx cap sync ios

      - name: Set the build number
        # Each TestFlight upload needs a unique, increasing CFBundleVersion.
        # The project is not set up for agvtool, so set CURRENT_PROJECT_VERSION
        # (Info.plist reads it via $(CURRENT_PROJECT_VERSION)) directly. BSD sed
        # on macOS needs the empty '' after -i.
        script: |
          cd "$CM_BUILD_DIR"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9][0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" \
            ios/App/App.xcodeproj/project.pbxproj
          echo "Set build number to $BUILD_NUMBER"

      - name: Initialize keychain
        script: keychain initialize

      - name: Fetch or create signing files
        # Creates the distribution certificate and provisioning profile for the
        # bundle id if they do not exist yet (they do not, for a new app), using
        # the API key and CERTIFICATE_PRIVATE_KEY from the appstore group.
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add the certificate to the keychain
        script: keychain add-certificates

      - name: Apply signing to the Xcode project
        script: xcode-project use-profiles

      - name: Resolve Swift packages
        # Capacitor 8 pulls its plugins in as Swift Package Manager packages
        # (the CapApp-SPM local package). build-ipa's internal
        # `xcodebuild -showBuildSettings` was failing with status 74 and no
        # visible reason - almost always SPM not being resolved yet. Doing it
        # explicitly here both fixes that and, if the real problem is something
        # else, prints the actual xcodebuild error instead of hiding it.
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -resolvePackageDependencies

      - name: Build the IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # Uploads the signed build to TestFlight so you can install it on your
      # iPhone. Does NOT submit to the App Store - that stays Phase 4.
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
