# Codemagic build recipe for the Cardtly iOS app.
#
# The app is a Capacitor remote-URL wrapper: the native shell loads
# www.cardtly.com in a WebView. There is deliberately NO `npm run build` here -
# the web is already live on Vercel, so the iOS build only has to assemble the
# native shell, sign it, and ship it. That keeps the build fast and means none
# of the website's env vars (Supabase, Paystack, Resend) are needed in CI.
#
# Signing is automatic: Codemagic uses the App Store Connect API key you added
# as an integration to create/fetch the distribution certificate and
# provisioning profile for com.cardtly.app. Nothing to upload by hand.
#
# First builds usually take one or two tries to go green - CI signing is fussy.
# When one fails, the log says why; that is expected, not a setback.

workflows:
  ios-testflight:
    name: Cardtly iOS - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      # This name must match EXACTLY the name you give the App Store Connect
      # integration in Codemagic (Team settings -> Integrations -> App Store
      # Connect). Name it: CardtlyASC
      app_store_connect: CardtlyASC

    environment:
      # Automatic code signing for the App Store, driven by the integration
      # above. Codemagic creates the certificate and profile if they do not
      # exist yet - which they do not, for a brand-new app.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cardtly.app
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 20
      # `latest` tracks Codemagic's current stable Xcode. If a build ever fails
      # on a too-new Xcode, pin this to a specific version (e.g. "16.2").
      xcode: latest

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Capacitor sync iOS
        # Copies the web config and refreshes the native plugin list. Safe to
        # run every build; it is how the native project stays in step with
        # capacitor.config.ts.
        script: npx cap sync ios

      - name: Set the build number
        # Each TestFlight upload needs a unique, increasing CFBundleVersion.
        # The project is not set up for agvtool, so set CURRENT_PROJECT_VERSION
        # (which Info.plist reads via $(CURRENT_PROJECT_VERSION)) directly.
        # BSD sed on macOS needs the empty '' after -i.
        script: |
          cd "$CM_BUILD_DIR"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9][0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" \
            ios/App/App.xcodeproj/project.pbxproj
          echo "Set build number to $BUILD_NUMBER"

      - name: Apply signing profiles
        script: xcode-project use-profiles

      - name: Build the IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # Sends the signed build straight to TestFlight so you can install it on
      # your iPhone. It does NOT submit to the App Store - that is Phase 4,
      # after screenshots and review notes are ready.
      app_store_connect:
        auth: integration
        submit_to_testflight: true
